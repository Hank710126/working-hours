  /* 方格筆記本風格 (與 Logo 一致)；管理者 body.admin 換成橘色 */
  :root{
    --brand:#1f5f99; --brand-d:#174a78; --brand-l:#dbe9f6; --on-brand:#fff;
    --paper:#fbf6ea; --grid:#ece5d2; --card:#fffdf7; --ink:#3a3226; --muted:#8a7f6c; --line:#ddd3bc;
    --note1:#fff3b5; --note2:#d7ecf9; --note3:#fde0d8;
    --ok:#2f7a2b; --ok-bar:#5aa152; --warn-ink:#9a6206; --warn-bar:#e3a21a; --err:#b8321a; --hol:#f6e9dc;
    --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
    --hand:'Patrick Hand','Comic Sans MS',cursive;
  }
  body.admin{
    --brand:#e8731c; --brand-d:#c65f12; --brand-l:#ffe2c4;
    --paper:#fff4e6; --grid:#f7ddc2; --note2:#ffe2c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  body{background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:20px 20px;background-attachment:fixed}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .hidden{display:none!important}
  .hand{font-family:var(--hand)}

  /* 標題列：一般 = 米白紙；管理者 = 橘色 */
  .bar{position:sticky;top:0;z-index:20;background:var(--card);color:var(--ink);border-bottom:1.5px solid var(--ink);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;display:flex;align-items:center;gap:6px;min-height:56px}
  body.admin .bar{background:var(--brand);color:#fff}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;background:center/cover no-repeat var(--card);border:1.5px solid var(--ink);margin-left:4px}

  .bar h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;font-weight:600}
  .bar .sub{display:block;font-size:12px;font-weight:400;opacity:.75}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
  .icon-btn:active{background:rgba(0,0,0,.08)}
  .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{padding:12px 12px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
  .section-title{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:600;letter-spacing:.02em}

  /* 卡片 / 清單：深色描邊，像畫在紙上 */
  .list,.card,.day,.summary-card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);overflow:hidden}
  .card{padding:14px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1.5px dashed var(--line);width:100%;text-align:left;color:inherit}
  .item:last-child{border-bottom:0}
  .item:active{background:var(--brand-l)}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t small{color:var(--muted);font-size:12px}
  .chev{color:var(--muted);flex:none}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:700;flex:none;border:1.5px solid var(--ink);font-family:var(--hand);font-size:18px}
  .item.mine{background:var(--brand-l)}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--brand);color:var(--on-brand);margin-left:6px;vertical-align:1px}

  .search{width:100%;padding:11px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);margin-bottom:10px;outline:none}
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}

  .resume{background:var(--brand);color:var(--on-brand);border:1.5px solid var(--ink);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
  .resume small{opacity:.85}

  /* 摘要：便利貼 */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin:2px 0 14px}
  .summary>div{border:1.5px solid var(--ink);border-radius:10px;padding:10px 8px 8px;text-align:center;background:var(--note1);transform:rotate(-1.5deg)}
  .summary>div:nth-child(2){background:var(--note2);transform:rotate(.8deg)}
  .summary>div:nth-child(3){background:var(--note3);transform:rotate(1.6deg)}
  .summary b{display:block;font-family:var(--hand);font-size:30px;line-height:1;color:var(--ink)!important;font-weight:400}
  .summary small{color:var(--ink);font-size:11px;opacity:.8}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);font-size:14px;white-space:nowrap}
  .chip.on{background:var(--brand);border-color:var(--ink);color:var(--on-brand)}

  /* 每日卡片 */
  .day{margin-bottom:10px}
  .day.hol{background:var(--hol)}
  .day-h{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
  .day-date{font-family:var(--hand);font-size:24px;line-height:1;min-width:58px}
  .day-date.short{color:#d0281a}
  .day-wd{color:var(--muted);font-size:12px}
  .day-mid{flex:1;min-width:0}
  .pbar{height:8px;border-radius:4px;background:#efe7d3;overflow:hidden;border:1px solid var(--line)}
  .pbar span{display:block;height:100%;border-radius:4px}
  .day-info{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tot{font-family:var(--hand);font-size:22px;min-width:52px;text-align:right}
  .tot.full{color:var(--ok)}
  .tot.warn{color:var(--warn-ink)}
  .tot.zero{color:#b9ad95}
  .day-b{border-top:1.5px dashed var(--line)}
  .proj{padding:10px 14px;border-bottom:1.5px dashed var(--line)}
  .proj:last-child{border-bottom:0}
  .proj.has{background:#fffbe9}
  body.admin .proj.has{background:#fff6ea}
  .proj-row{display:flex;align-items:center;gap:8px}
  .proj-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj-name small{font-weight:400;color:var(--ink);font-size:11px;background:#ece4cf;border-radius:5px;padding:1px 6px;margin-left:6px}
  .dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-left:6px;vertical-align:1px;border:1px solid var(--ink)}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:none;background:#fff}
  .stepper button{width:38px;height:36px;font-size:20px;color:var(--brand);display:grid;place-items:center}
  .stepper button:active{background:var(--brand-l)}
  .stepper input{width:44px;height:36px;border:0;text-align:center;outline:none;background:transparent;font-family:var(--hand);font-size:22px}
  .act{margin-top:6px;width:100%;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:6px 2px;font-size:14px;resize:none;outline:none;background:transparent;min-height:34px;color:#5e5442}
  .act:focus{border-bottom-color:var(--brand)}
  .stepper:focus-within{box-shadow:0 0 0 3px var(--brand-l)}
  .more{display:block;width:100%;padding:11px;color:var(--brand-d);font-weight:600;border-top:1.5px dashed var(--line)}

  /* 專案頁 */
  .pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1.5px dashed var(--line)}
  .pcard:last-child{border-bottom:0}
  .pcard .t{flex:1;min-width:0}
  .pcard .t b{display:block}
  .pcard .t small{color:var(--muted)}
  .pcard .hrs{font-family:var(--hand);font-size:22px;color:var(--brand-d);min-width:48px;text-align:right}
  .del{color:var(--err);padding:8px}
  .primary{display:block;width:100%;padding:14px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;text-align:center;margin:12px 0;border:1.5px solid var(--ink)}
  .primary:active{background:var(--brand-d)}
  .primary:disabled{opacity:.5}
  .ghost{display:block;width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--brand-d);font-weight:600;border:1.5px solid var(--ink);text-align:center;margin:10px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .field textarea{width:100%;min-height:80px;border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;outline:none;background:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}

  /* Admin 功能磚塊 */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tile{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:1.25;min-height:92px}
  .tile .ic{width:54px;height:54px;border-radius:16px;border:1.5px solid var(--ink);display:grid;place-items:center;margin-bottom:2px}
  .tile:nth-child(3n+1) .ic{background:var(--note1);transform:rotate(-3deg)}
  .tile:nth-child(3n+2) .ic{background:var(--brand-l);transform:rotate(2deg)}
  .tile:nth-child(3n) .ic{background:var(--note3);transform:rotate(-1.5deg)}
  .tile.main .ic{background:#fff;border-color:var(--ink)}
  .tile svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tile svg .f1{fill:#fff}
  .tile svg .f2{fill:var(--brand)}
  .tile svg .f3{fill:var(--note1)}
  .tile:active{background:var(--brand-l)}
  .tile.main{background:var(--brand);color:var(--on-brand);font-weight:600}

  /* 底部分頁 */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--ink);display:flex;padding-bottom:var(--safe-b)}
  .tabs button{flex:1;min-width:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .tabs button.hidden{display:none}
  .tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabs button.on{color:var(--brand-d);font-weight:600}

  /* 儲存提示條 */
  .savebar{position:fixed;left:12px;right:12px;bottom:calc(68px + var(--safe-b));z-index:25;max-width:696px;margin:0 auto;
    background:var(--brand);color:var(--on-brand);border:1.5px solid var(--ink);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px}
  .savebar span{flex:1;font-size:14px}
  .savebar button{padding:8px 14px;border-radius:10px;font-weight:700}
  .savebar .undo{color:inherit;opacity:.85}
  .savebar .go{background:#fff;color:var(--brand-d);border:1.5px solid var(--ink)}

  /* 底部面板 */
  .backdrop{position:fixed;inset:0;background:rgba(40,30,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b);border:1.5px solid var(--ink);border-bottom:0}
  .sheet-h{display:flex;align-items:center;padding:14px 16px;gap:8px;border-bottom:1.5px solid var(--ink);background:var(--card);border-radius:18px 18px 0 0}
  .sheet-h h2{flex:1;font-size:17px;margin:0}
  .sheet-b{overflow:auto;padding:12px}
  .sheet-f{padding:10px 12px;border-top:1.5px solid var(--ink);background:var(--card)}
  .pick{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1.5px dashed var(--line);background:var(--card);width:100%;text-align:left}
  .pick input{width:20px;height:20px;accent-color:var(--brand)}
  .pick .t{flex:1}
  .bu{font-size:12px;color:var(--ink);background:#ece4cf;border-radius:6px;padding:2px 7px}
  .bu-h{font-size:12px;color:var(--muted);padding:10px 14px 4px;font-weight:700}

  /* 讀取中 / 提示 */
  .loading{position:fixed;inset:0;z-index:60;background:rgba(251,246,234,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:70;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
  .toast.err{background:var(--err)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
</style>
</head>
<body>

<header class="bar">
  <button class="icon-btn hidden" id="btnBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="logo" aria-hidden="true"></div>
  <h1 id="title">Working Hours</h1>
  <button class="icon-btn hidden" id="btnReload" aria-label="重新整理"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>

<main id="view"></main>

<div class="savebar hidden" id="savebar">
  <span id="saveInfo"></span>
  <button class="undo" id="btnUndo">復原</button>
  <button class="go" id="btnSave">儲存</button>
</div>

<nav class="tabs hidden" id="tabs">
  <button data-tab="days" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>每日工時</button>
  <button data-tab="projects"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg>我的專案</button>
  <button data-tab="bu"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>BU 時數</button>
  <button data-tab="list" class="hidden"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>專案清單</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
  <button data-tab="admin" class="hidden"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Admin</button>
</nav>

<div id="modal"></div>
<div class="loading hidden" id="loading"><div class="spin"></div><div id="loadingText">讀取中…</div></div>

<script>
/* ============================================================
 * 後端呼叫：Apps Script 上用 google.script.run；本機預覽用假資料
 * ============================================================ */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// 網頁版 (GitHub Pages)：畫面放在自己的網址，透過 Apps Script 的資料 API (doPost) 讀寫試算表
const WEB_API = (!IS_GAS && window.WH_API) || '';
const USE_MOCK = !IS_GAS && (!WEB_API || /[?&]mock\b/.test(location.search));
async function callWeb(fn, args) {
  let res;
  try {
    res = await fetch(WEB_API, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  } catch (e) { throw new Error('連線失敗，請確認網路後再試一次'); }
  if (!res.ok) throw new Error('連線失敗（' + res.status + '），請稍後再試');
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('伺服器回應格式錯誤，請稍後再試'); }
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j.result;
}
function call(fn, ...args) {
  if (!USE_MOCK && WEB_API) return callWeb(fn, args);
  return new Promise((resolve, reject) => {
    if (IS_GAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e))))[fn](...args);
    } else {
      setTimeout(() => { try { resolve(MOCK[fn](...JSON.parse(JSON.stringify(args)))); } catch (e) { reject(e); } }, 350);
    }
  });
}
// 需要登入的呼叫：自動帶上登入憑證；憑證失效時回到登入畫面
async function callA(fn, ...args) {
  try { return await call(fn, S.token, ...args); }
  catch (e) {
    if (/AUTH:/.test(e.message || '')) { logout(true); throw new Error(String(e.message).replace(/^.*AUTH:\s*/, '')); }
    throw e;
  }
}

/* 手機記住登入狀態 (每個裝置各自記住) */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('wh_' + k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('wh_' + k) : localStorage.setItem('wh_' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時下次需重新登入 */ } },
};

/* Face ID / 指紋 / 臉部解鎖 (只在網頁版)：
 * 用手機內建的生物辨識 (WebAuthn) 當作「開 App 的鎖」。驗證成功才使用手機上記住的登入。 */
const BIO = {
  label: /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'Face ID' : '指紋 / 臉部辨識',
  async available() {
    try { return !!(WEB_API && window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
    catch (e) { return false; }
  },
  get() { return store.get('bio'); },                       // { id, p }
  rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); },
  b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); },
  unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  async enable(person) {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: this.rnd(32), rp: { name: 'Working Hours', id: location.hostname },
      user: { id: this.rnd(16), name: person, displayName: 'Working Hours · ' + person },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000 } });
    store.set('bio', { id: this.b64(cred.rawId), p: person });
  },
  async verify() {
    const b = this.get();
    await navigator.credentials.get({ publicKey: {
      challenge: this.rnd(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
      allowCredentials: [{ type: 'public-key', id: this.unb64(b.id), transports: ['internal'] }] } });
  },
  off() { store.set('bio', null); },
};

/* ============================================================
 * 狀態
 * ============================================================ */
const S = {
  route: 'login',      // login | pin | home | sheet
  token: store.get('token'), last: store.get('last'),
  people: null, pinFor: null,
  folders: null,
  data: null,          // 工時表資料 (api_load)
  edits: {},           // 'sheet|k' -> {h, a}
  tab: 'days', week: null, openDays: {}, showAll: {}, peopleQuery: '',
  admin: false, adminEmail: '',                  // 管理者 (Google 驗證為 hank.wang@quantatw.com)
  buWeek: null, buOpen: {},                      // BU 時數
  bp: null, bpTeam: 0, bpQuery: '',              // 專案清單 (BU Project)
  drive: null, tm: null, tmDirty: false,         // 管理者：雲端硬碟、Team Member
};
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 2200);
}
let loadingCount = 0;
function loading(on, text) {
  loadingCount += on ? 1 : -1;
  $('#loadingText').textContent = text || '讀取中…';
  $('#loading').classList.toggle('hidden', loadingCount <= 0);
}
async function busy(text, fn) {
  loading(true, text);
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), true); throw e; }
  finally { loading(false); }
}

/* ============================================================
 * 時數 / Action 規則 (與試算表 onEdit 相同)
 * ============================================================ */
function num(v) { if (v === '' || v == null) return 0; const n = Number(v); return isFinite(n) ? n : 0; }
function hasHours(v) { return num(v) !== 0; }
function fmtH(n) { n = Math.round(n * 100) / 100; return String(n); }

function cell(p, k) {
  const key = p.sheet + '|' + k;
  const base = p.cells[k];
  if (!base) return null;
  const e = S.edits[key];
  return { r: base.r, h: e ? e.h : base.h, a: e ? e.a : base.a, dirty: !!e, base };
}
function setCell(p, k, h, a) {
  const key = p.sheet + '|' + k;
  const base = p.cells[k];
  if (String(base.h) === String(h) && String(base.a) === String(a)) delete S.edits[key];
  else S.edits[key] = { h, a };
  updateSaveBar();
}
// 改時數：有時數且工作內容空白 (或是預設內容) -> 自動帶入預設工作內容；時數清為 0 -> 清掉自動帶入的內容 (ADC 除外)
function changeHours(p, k, h) {
  const c = cell(p, k);
  const def = (S.data.action || '').trim();
  let a = c.a || '';
  if (!p.adc && def) {
    const auto = !a.trim() || a.trim() === def;
    if (hasHours(h) && auto) a = def;
    if (!hasHours(h) && a.trim() === def) a = '';
  }
  setCell(p, k, h === '' ? '' : Number(h), a);
}
function dayTotal(k) {
  return S.data.projects.reduce((s, p) => { const c = cell(p, k); return s + (c ? num(c.h) : 0); }, 0);
}
function projTotal(p) {
  return S.data.days.reduce((s, d) => { const c = cell(p, d.k); return s + (c ? num(c.h) : 0); }, 0);
}
function dirtyCount() { return Object.keys(S.edits).length; }

/* ============================================================
 * 路由 / 畫面
 * ============================================================ */
function setBar(title, sub, back, reload) {
  $('#title').innerHTML = esc(title) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '');
  $('#btnBack').classList.toggle('hidden', !back);
  $('#btnReload').classList.toggle('hidden', !reload);
}
function render() {
  const v = $('#view');
  $('#tabs').classList.toggle('hidden', S.route !== 'sheet');
  if (S.route === 'login') return renderLogin(v);
  if (S.route === 'pin') return renderPin(v);
  if (S.route === 'locked') return renderLocked(v);
  if (S.route === 'home') return renderHome(v);
  if (S.route === 'sheet') return renderSheet(v);
  if (S.route === 'admin') return renderAdmin(v);
  if (S.route === 'drive') return renderDrive(v);
  if (S.route === 'members') return renderMembers(v);
  if (S.route === 'busum') return renderBuSum(v);
}

/* ---------- 登入：選名字 ---------- */
function renderLogin(v) {
  setBar('Working Hours 工時表', '請選擇你的名字', false, true);
  if (!S.people) { v.innerHTML = '<div class="empty">讀取成員名單…</div>'; return; }
  const q = S.peopleQuery.trim().toLowerCase();
  const list = S.people.filter(p => !q || p.name.toLowerCase().includes(q));
  let h = `<input class="search" id="peopleSearch" placeholder="搜尋姓名…" value="${esc(S.peopleQuery)}" autocomplete="off">`;
  h += list.length ? '<div class="list">' + list.map(p => `
    <button class="item" data-person="${esc(p.name)}">
      <div class="avatar">${esc(p.name.slice(0, 1).toUpperCase())}</div>
      <div class="t"><b>${esc(p.name)}</b><small>${p.has ? '輸入密碼登入' : '第一次使用：設定密碼'}</small></div>
      <span class="chev">›</span></button>`).join('') + '</div>' : '<div class="empty">沒有符合的名字</div>';
  h += '<div class="hint" style="text-align:center;margin-top:14px">登入後這支手機會記住你，下次打開直接進入自己的工時表。</div>';
  v.innerHTML = h;
  const s = $('#peopleSearch');
  s.oninput = () => { S.peopleQuery = s.value; const pos = s.selectionStart; renderLogin(v); const n = $('#peopleSearch'); n.focus(); n.setSelectionRange(pos, pos); };
}

/* ---------- 登入：輸入 / 設定密碼 ---------- */
// 密碼：英文＋數字，不分大小寫；新密碼 6～12 碼且至少 1 個英文字母、1 個數字 (舊的純數字密碼仍可登入)
const PIN_ATTRS = 'inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="12"';
const pinOk = s => /^[A-Za-z0-9]{4,12}$/.test(s);
const newPinOk = s => /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9]{6,12}$/.test(s);
const NEW_PIN_MSG = '密碼要 6～12 碼，至少包含 1 個英文字母和 1 個數字（例如 abc123）';

function renderPin(v) {
  const p = S.pinFor;
  setBar(p.name, p.has ? '輸入密碼' : '第一次使用：設定密碼', true, false);
  v.innerHTML = `<div class="card field" style="margin-top:8px">
    <div style="text-align:center;margin:6px 0 16px"><div class="avatar" style="width:64px;height:64px;font-size:26px;margin:0 auto 8px">${esc(p.name.slice(0, 1).toUpperCase())}</div>
      <b style="font-size:18px">${esc(p.name)}</b></div>
    <label>${p.has ? '密碼' : '設定密碼（6～12 碼，英文＋數字）'}</label>
    <input class="search" id="pin1" type="password" ${PIN_ATTRS} autocomplete="${p.has ? 'current-password' : 'new-password'}">
    ${p.has ? '' : '<label>再輸入一次</label><input class="search" id="pin2" type="password" ' + PIN_ATTRS + ' autocomplete="new-password">'}
    <button class="primary" id="btnLogin">${p.has ? '登入' : '設定密碼並登入'}</button>

async function doLogin() {
  const p = S.pinFor;
  const pin = $('#pin1').value.trim();
  if (p.has && !pinOk(pin)) return toast('密碼只能是英文字母和數字', true);
  if (!p.has && !newPinOk(pin)) return toast(NEW_PIN_MSG, true);
  if (!p.has && pin.toLowerCase() !== $('#pin2').value.trim().toLowerCase()) return toast('兩次輸入的密碼不一樣', true);
  const r = await busy(p.has ? '登入中…' : '設定密碼中…', () => call('api_login', p.name, pin));
  S.token = r.token; store.set('token', r.token);
  if (!S.last || (S.last.person || '').toLowerCase() !== p.name.toLowerCase()) { S.last = null; store.set('last', null); }
  const bio = BIO.get();
  if (bio && bio.p.toLowerCase() !== p.name.toLowerCase()) BIO.off();   // 換人登入：前一個人的 Face ID 失效
  toast(r.created ? '✔ 密碼已設定，歡迎 ' + p.name : '✔ 歡迎 ' + p.name);
  goHome(true);
  if (!BIO.get() && await BIO.available()) offerBio(p.name);
}

/* ---------- 工時表 ---------- */
function weeks() {
  const out = [];
  S.data.days.forEach(d => { if (!out.includes(String(d.w))) out.push(String(d.w)); });
  return out;
}
function todayKey() {
  const t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }

function renderSheet(v) {
  const d = S.data;
  setBar(d.person || d.title, d.folderName || d.title, true, true);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (S.tab === 'days') renderDays(v);
  else if (S.tab === 'projects') renderProjects(v);
  else if (S.tab === 'bu') renderBU(v);
  else if (S.tab === 'list') renderBPList(v);
  else renderSettings(v);
}

function renderDays(v) {
  const d = S.data;
  const ws = weeks();
  if (!S.week || !ws.includes(S.week)) {
    const t = d.days.find(x => x.k === todayKey());
    S.week = t ? String(t.w) : ws[0];
  }
  const days = d.days.filter(x => String(x.w) === S.week);
  let h = diffBannerHtml() + `<div class="summary" id="summary">${summaryHtml()}</div>`;
  h += '<div class="chips">' + ws.map(w => `<button class="chip ${w === S.week ? 'on' : ''}" data-week="${esc(w)}">Week ${esc(w)}</button>`).join('') + '</div>';
  if (!d.projects.length) h += '<div class="empty">還沒有專案，請到「專案」頁新增</div>';

  days.forEach(x => {
    const dt = parseKey(x.k);
    const open = !!S.openDays[x.k];
    const used = usedProjects(x.k);
    const isToday = x.k === todayKey();
    h += `<div class="day ${x.hol ? 'hol' : ''}">
      <button class="day-h" data-day="${x.k}">
        <div><div class="day-date ${isShort(x) ? 'short' : ''}">${dt.getMonth() + 1}/${dt.getDate()}</div><div class="day-wd">週${WD[dt.getDay()]}${isToday ? ' · 今天' : ''}</div></div>
        ${dayHeadHtml(x)}
      </button>`;
    if (open) {
      const showAll = S.showAll[x.k] || !used.length;
      const list = showAll ? d.projects : used;
      h += '<div class="day-b">' + list.map(p => projEditor(p, x.k)).join('');
      if (!showAll || used.length < d.projects.length) {
        h += `<button class="more" data-showall="${x.k}">${showAll ? '只顯示有時數的專案' : '＋ 填寫其他專案 (' + (d.projects.length - used.length) + ')'}</button>`;
      }
      h += '</div>';
    }
    h += '</div>';
  });
  v.innerHTML = h;
}

// All 分頁與專案分頁不一致的提示
function diffBannerHtml() {
  const ds = S.data.diffs || [];
  if (!ds.length) return '';
  const fmtK = k => { const d = parseKey(k); return (d.getMonth() + 1) + '/' + d.getDate(); };
  const v = x => (x === '' || x == null) ? '空白' : x;
  const rows = ds.slice().sort((a, b) => a.k.localeCompare(b.k) || a.sheet.localeCompare(b.sheet))
    .map(d => `<li>${fmtK(d.k)}　${esc(d.sheet)}：專案分頁 ${esc(v(d.proj))} → All 分頁 <b>${esc(v(d.all))}</b></li>`).join('');
  return `<div class="card" style="background:var(--note1);margin-bottom:12px">
    <b style="color:#7a5d00">⚠ All 分頁與專案分頁有 ${ds.length} 筆時數不一致</b>
    <div class="hint" style="margin-top:4px">App 顯示的是專案分頁的時數。這通常是在 All 分頁填寫時，自動同步沒有成功造成的。</div>
    <details style="margin-top:8px"><summary style="color:var(--brand);font-size:14px">查看明細</summary>
      <ul style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.7">${rows}</ul></details>
    <button class="primary" data-fix="all" style="margin:10px 0 0">以 All 分頁為準修正 (${ds.length} 筆)</button>
    <button class="ghost" data-fix="proj" style="margin:8px 0 0">以專案分頁為準修正</button>
  </div>`;
}

function usedProjects(k) {
  return S.data.projects.filter(p => { const c = cell(p, k); return c && hasHours(c.h); });
}
function summaryHtml() {
  const d = S.data;
  const weekTot = d.days.filter(x => String(x.w) === S.week).reduce((s, x) => s + dayTotal(x.k), 0);
  const allTot = d.days.reduce((s, x) => s + dayTotal(x.k), 0);
  // 加班時數 (本週加總)：上班日超過 8 小時的部分；假日 (週末 / 國定假日) 的時數全部算加班
  const ot = d.days.filter(x => String(x.w) === S.week)
    .reduce((s, x) => s + (x.hol ? dayTotal(x.k) : Math.max(0, dayTotal(x.k) - 8)), 0);
  return `<div><b>${fmtH(weekTot)}</b><small>Week ${esc(S.week)} 時數</small></div>
    <div><b>${fmtH(allTot)}</b><small>本期總時數</small></div>
    <div><b>${fmtH(ot)}</b><small>Week ${esc(S.week)} 加班時數</small></div>`;
}
// 未滿 8 小時的上班日 (日期標紅色)：有填寫但不足 8 小時；還沒填寫 (0 小時) 不標紅
function isShort(x) {
  const t = dayTotal(x.k);
  return !x.hol && t > 0 && t < 8;
}
function dayHeadHtml(x) {
  const tot = dayTotal(x.k);
  const cls = tot === 0 ? 'zero' : tot < 8 ? 'warn' : 'full';
  const used = usedProjects(x.k);
  const info = used.length ? used.map(p => p.sheet + ' ' + fmtH(num(cell(p, x.k).h))).join('、') : (x.hol ? '假日' : '尚未填寫');
  const pct = Math.min(100, tot / 8 * 100);
  const color = tot >= 8 ? 'var(--ok-bar)' : 'var(--warn-bar)';
  return `<div class="day-mid"><div class="pbar"><span style="width:${pct.toFixed(0)}%;background:${color}"></span></div><div class="day-info">${esc(info)}</div></div>` +
    `<div class="tot ${cls}">${fmtH(tot)}h${tot >= 8 ? ' ✓' : ''}</div>`;
}
// 只更新受影響的格子 / 當天標題 / 摘要，不重畫整頁 (避免使用者正在輸入的欄位失去焦點)
function refreshCell(box, p, k) {
  const c = cell(p, k);
  const inp = box.querySelector('[data-hours]');
  if (document.activeElement !== inp) inp.value = c.h === '' ? '' : c.h;
  const ta = box.querySelector('[data-action]');
  if (ta.value !== c.a) { ta.value = c.a; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  box.classList.toggle('has', hasHours(c.h));
  const nm = box.querySelector('.proj-name');
  const dot = nm.querySelector('.dirty-dot');
  if (c.dirty && !dot) nm.insertAdjacentHTML('beforeend', '<span class="dirty-dot"></span>');
  if (!c.dirty && dot) dot.remove();
  const x = S.data.days.find(d => d.k === k);
  const head = document.querySelector('.day-h[data-day="' + k + '"]');
  if (head && x) {
    head.querySelector('.day-mid').remove(); head.querySelector('.tot').remove(); head.insertAdjacentHTML('beforeend', dayHeadHtml(x));
    head.querySelector('.day-date').classList.toggle('short', isShort(x));
  }
  const sm = $('#summary');
  if (sm) sm.innerHTML = summaryHtml();
}

function projEditor(p, k) {
  const c = cell(p, k);
  if (!c) return '';
  const id = encodeURIComponent(p.sheet) + '|' + k;
  return `<div class="proj ${hasHours(c.h) ? 'has' : ''}" data-cell="${esc(id)}">
    <div class="proj-row">
      <div class="proj-name">${esc(p.sheet)}<small>${esc(p.bu)}</small>${c.dirty ? '<span class="dirty-dot"></span>' : ''}</div>
      <div class="stepper">
        <button data-step="-0.5" aria-label="減少">−</button>
        <input inputmode="decimal" data-hours value="${esc(c.h === '' ? '' : c.h)}" placeholder="0">
        <button data-step="0.5" aria-label="增加">＋</button>
      </div>
    </div>
    <textarea class="act" rows="1" data-action placeholder="${p.adc ? '工作內容 (ADC 不自動帶入)' : '工作內容'}">${esc(c.a)}</textarea>
  </div>`;
}

/* ---------- 新增專案 (底部面板) ---------- */
async function openAddProjects(refresh) {
  const res = await busy(refresh ? '更新專案清單…' : '讀取專案清單…', () => callA('api_availableProjects', S.data.id, !!refresh));
  if (res.note) toast(res.note, /未更新/.test(res.note));
  const picked = new Set();
  let q = '';
  const draw = () => {
    const list = res.projects.filter(p => !q || p.name.toLowerCase().includes(q) || (p.bu || '').toLowerCase().includes(q));
    let body = '', lastBu = null;
    list.forEach(p => {
      if (p.bu !== lastBu) { body += `<div class="bu-h">${esc(p.bu || '其他')}</div>`; lastBu = p.bu; }
      body += `<label class="pick"><input type="checkbox" data-pick="${esc(p.name)}" ${picked.has(p.name) ? 'checked' : ''}><div class="t">${esc(p.name)}</div><span class="bu">${esc(p.bu || '')}</span></label>`;
    });
    $('#pickList').innerHTML = body || '<div class="empty">' + (res.projects.length ? '沒有符合的專案' : '「' + esc(res.team) + '」的專案都已經加入了') + '</div>';
    $('#btnPickGo').textContent = picked.size ? '新增 ' + picked.size + ' 個專案' : '請勾選專案';
    $('#btnPickGo').disabled = !picked.size;
  };
  $('#modal').innerHTML = `<div class="backdrop" id="bd"><div class="sheet">
    <div class="sheet-h"><h2>新增專案 <small style="font-weight:400;color:var(--muted);font-size:13px">${esc(res.team)}</small></h2>
      <button class="ghost" style="width:auto;margin:0;padding:6px 10px;font-size:13px" id="btnPickRefresh">更新清單</button>
      <button class="icon-btn" id="btnPickClose" style="color:var(--muted)">✕</button></div>
    <div class="sheet-b"><input class="search" id="pickSearch" placeholder="搜尋專案 / BU…" autocomplete="off"><div class="list" id="pickList"></div></div>
    <div class="sheet-f"><button class="primary" style="margin:0" id="btnPickGo" disabled>請勾選專案</button></div>
  </div></div>`;
  draw();
  const close = () => { $('#modal').innerHTML = ''; };
  $('#bd').onclick = e => { if (e.target.id === 'bd') close(); };
  $('#btnPickClose').onclick = close;
  $('#btnPickRefresh').onclick = () => { close(); openAddProjects(true); };
  $('#pickSearch').oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  $('#pickList').onchange = e => {
    const n = e.target.dataset.pick; if (!n) return;
    e.target.checked ? picked.add(n) : picked.delete(n); draw();
  };
  $('#btnPickGo').onclick = async () => {
    if (!(await ensureSaved())) return;
    const picks = res.projects.filter(p => picked.has(p.name));
    close();
    const data = await busy('新增專案中… (約 10~30 秒)', () => callA('api_addProjects', S.data.id, picks));
    setData(data);
    toast('已新增：' + (data.added || []).join(', '));
  };
}

/* ============================================================
 * 資料載入 / 儲存

// 專案顯示順序：BU1 → BU15 (依數字)，同 BU 依專案名稱英文排序 (IG3 < IG10)；ADC 固定最後
function projOrder(a, b) {
  return (a.adc - b.adc) || (buKey(a.bu) - buKey(b.bu)) ||
    a.sheet.localeCompare(b.sheet, 'en', { numeric: true, sensitivity: 'base' });
}
function setData(data) {

async function openFile(id) {
  if (S.data && S.data.id !== id && !(await ensureSaved())) return;

function updateSaveBar() {

}
async function save() {
  const changes = Object.keys(S.edits).map(key => {
    const i = key.lastIndexOf('|');
    const sheet = key.slice(0, i), k = key.slice(i + 1);
    const p = S.data.projects.find(x => x.sheet === sheet);
    return { sheet, k, r: p.cells[k].r, h: S.edits[key].h, a: S.edits[key].a };
  });
  if (!changes.length) return true;
  const data = await busy('儲存中…', () => callA('api_save', S.data.id, changes));
  setData(data);
  toast('✔ 已儲存 ' + (data.saved || changes.length) + ' 筆');
  return true;
}
async function ensureSaved() {
  if (!dirtyCount()) return true;
  if (confirm('有 ' + dirtyCount() + ' 筆變更尚未儲存，要先儲存嗎？\n(按「取消」放棄變更)')) {
    try { return await save(); } catch (e) { return false; }
  }
  S.edits = {}; updateSaveBar();
  return true;
}

  }

      BIO.off(); toast('已關閉 ' + BIO.label); return render();
    }
    if (!(await BIO.available())) return toast('這支手機（或瀏覽器）不支援 ' + BIO.label + '，或尚未在手機設定中啟用', true);

    return render();
  }
  const t = e.target.closest('button,[data-open],[data-folder]');
  if (!t) return;
  if (t.dataset.person) {
    S.pinFor = S.people.find(p => p.name === t.dataset.person);
    S.route = 'pin'; return render();
  }
  if (t.id === 'btnLogin') return doLogin().catch(() => {});
  if (t.id === 'btnChangePin') return changePin().catch(() => {});
  if (t.id === 'btnLogout') {
    if (!confirm('登出後這支手機需要重新選名字、輸入密碼。確定登出？')) return;
    if (await ensureSaved()) { BIO.off(); logout(); }
    return;
  }
  if (t.dataset.folder) return openFolder(t.dataset.folder);
  if (t.dataset.open) return openFile(t.dataset.open);
  if (t.dataset.week) { S.week = t.dataset.week; return render(); }
  if (t.dataset.day) { S.openDays[t.dataset.day] = !S.openDays[t.dataset.day]; return render(); }
  if (t.dataset.showall) { const k = t.dataset.showall; S.showAll[k] = !S.showAll[k]; return render(); }
  if (t.dataset.step) {
    const box = t.closest('[data-cell]');
    const [sheet, k] = cellId(box);
    const p = S.data.projects.find(x => x.sheet === sheet);
    const cur = num(cell(p, k).h);
    const nv = Math.max(0, Math.min(24, Math.round((cur + Number(t.dataset.step)) * 2) / 2));
    changeHours(p, k, nv === 0 ? '' : nv);
    return refreshCell(box, p, k);
  }
  if (t.dataset.del) {
    const name = t.dataset.del;
    if (!confirm('確定刪除專案「' + name + '」？\n該分頁的時數與工作內容會一併刪除。')) return;
    if (!(await ensureSaved())) return;
    const data = await busy('刪除中…', () => callA('api_deleteProject', S.data.id, name));
    setData(data); toast('已刪除「' + name + '」');
    return;
  }
  if (t.dataset.fix) {
    const useProj = t.dataset.fix === 'proj';
    if (!(await ensureSaved())) return;
    const n = (S.data.diffs || []).length;
    if (!confirm(useProj ? '把 All 分頁的 ' + n + ' 筆時數，改成和專案分頁一樣？' : '把專案分頁的 ' + n + ' 筆時數，改成和 All 分頁一樣？')) return;
    const data = await busy('修正中…', () => callA('api_fixFromAll', S.data.id, useProj));
    setData(data); toast('✔ 已修正 ' + (data.fixed || 0) + ' 筆');
    return;
  }
  if (t.id === 'btnAddProj') return openAddProjects(false);
  if (t.id === 'btnSwitch') { if (await ensureSaved()) goHome(false); return; }
  if (t.id === 'btnDefAction') {
    if (!(await ensureSaved())) return;
    const text = $('#defAction').value;
    const data = await busy('套用中… (約 10~30 秒)', () => callA('api_setDefaultAction', S.data.id, text));
    setData(data); toast('✔ 預設工作內容已套用');
  }
});
function cellId(box) {
  const id = box.dataset.cell; const i = id.lastIndexOf('|');
  return [decodeURIComponent(id.slice(0, i)), id.slice(i + 1)];
}

$('#view').addEventListener('change', e => {

function openModal(title, body, foot) {
  $('#modal').innerHTML = `<div class="backdrop" id="bd"><div class="sheet">
    <div class="sheet-h"><h2>${title}</h2><button class="icon-btn" data-close style="color:var(--muted)">✕</button></div>
    <div class="sheet-b">${body}</div>${foot ? '<div class="sheet-f">' + foot + '</div>' : ''}</div></div>`;
  const el = $('#bd');
  const close = () => { $('#modal').innerHTML = ''; };
  el.addEventListener('click', e => { if (e.target.id === 'bd' || e.target.closest('[data-close]')) close(); });
  return { el, close, q: s => el.querySelector(s) };
}
const buKey = b => { const m = String(b || '').match(/(\d+)/); return m ? Number(m[1]) : 9999; };
const buSort = (a, b) => buKey(a) - buKey(b) || String(a).localeCompare(String(b));

/* ============================================================
 * BU 時數：本期各週、各 BU 的時數累計 (含尚未儲存的修改)
 * ============================================================ */
function buStats() {
  const m = {}, pj = {};
  S.data.projects.forEach(p => {
    const bu = p.bu || '(未填 BU)';
    S.data.days.forEach(d => {
      const c = cell(p, d.k); const h = c ? num(c.h) : 0;
      if (!h) return;
      const w = String(d.w);
      m[bu] = m[bu] || {}; m[bu][w] = (m[bu][w] || 0) + h;
      pj[bu] = pj[bu] || {}; pj[bu][p.sheet] = pj[bu][p.sheet] || {}; pj[bu][p.sheet][w] = (pj[bu][p.sheet][w] || 0) + h;
    });
  });
  return { ws: weeks(), bus: Object.keys(m).sort(buSort), m, pj };
}
function renderBU(v) {
  const st = buStats();
  if (!S.buWeek) { const t = S.data.days.find(x => x.k === todayKey()); S.buWeek = t ? String(t.w) : 'all'; }
  const sel = S.buWeek;
  const val = (bu, w) => w === 'all' ? Object.values(st.m[bu] || {}).reduce((a, b) => a + b, 0) : ((st.m[bu] || {})[w] || 0);
  const pval = (bu, p, w) => { const x = st.pj[bu][p]; return w === 'all' ? Object.values(x).reduce((a, b) => a + b, 0) : (x[w] || 0); };
  const rows = st.bus.map(bu => ({ bu, h: val(bu, sel) })).filter(r => r.h);
  const tot = rows.reduce((s, r) => s + r.h, 0);
  const max = Math.max(1, ...rows.map(r => r.h));

  let h = S.admin ? '<button class="ghost" data-act="butab" style="margin:0 0 12px">👥 看本期全部人的 BU 時數 (Hank Team / JL Team)</button>' : '';
  h += '<div class="chips">' + [['all', '全部期間']].concat(st.ws.map(w => [w, 'Week ' + w]))
    .map(([w, t]) => `<button class="chip ${w === sel ? 'on' : ''}" data-buweek="${esc(w)}">${esc(t)}</button>`).join('') + '</div>';
  h += `<div class="summary"><div><b>${fmtH(tot)}</b><small>${sel === 'all' ? '本期' : 'Week ' + esc(sel)} 總時數</small></div><div><b>${rows.length}</b><small>BU 數</small></div></div>`;
  if (!rows.length) h += '<div class="empty">這段期間還沒有時數</div>';
  else h += '<div class="list">' + rows.map(r => {
    const open = !!S.buOpen[r.bu];
    let x = `<button class="item" data-buopen="${esc(r.bu)}" style="display:block">
      <div style="display:flex;align-items:center;gap:10px"><b style="flex:1">${esc(r.bu)}</b>
        <span style="color:var(--muted);font-size:12px">${Math.round(r.h / tot * 100)}%</span>
        <b style="color:var(--brand);min-width:54px;text-align:right">${fmtH(r.h)}h</b></div>
      <div style="height:6px;background:#efe7d3;border:1px solid var(--line);border-radius:3px;margin-top:8px"><div style="height:6px;border-radius:3px;background:var(--brand);width:${(r.h / max * 100).toFixed(1)}%"></div></div>
    </button>`;
    if (open) x += '<div style="background:var(--paper);padding:4px 14px 10px">' + Object.keys(st.pj[r.bu]).map(p => ({ p, h: pval(r.bu, p, sel) })).filter(o => o.h)
      .sort((a, b) => b.h - a.h).map(o => `<div style="display:flex;padding:5px 0;font-size:14px"><span style="flex:1">${esc(o.p)}</span><b>${fmtH(o.h)}h</b></div>`).join('') + '</div>';
    return x;
  }).join('') + '</div>';

  // 各週 × BU 總表
  if (st.bus.length) {
    const colTot = w => st.bus.reduce((s, bu) => s + val(bu, w), 0);
    h += '<div class="section-title">各週 BU 時數</div><div class="card" style="padding:0;overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">';
    h += '<tr style="background:var(--brand-l)"><th style="text-align:left;padding:8px 10px">BU</th>' + st.ws.map(w => `<th style="padding:8px 6px;text-align:right">W${esc(w)}</th>`).join('') + '<th style="padding:8px 10px;text-align:right">合計</th></tr>';
    h += st.bus.map(bu => `<tr style="border-top:1px solid var(--line)"><td style="padding:7px 10px;font-weight:600">${esc(bu)}</td>` +
      st.ws.map(w => `<td style="padding:7px 6px;text-align:right">${val(bu, w) ? fmtH(val(bu, w)) : '<span style="color:#c4cbd3">-</span>'}</td>`).join('') +
      `<td style="padding:7px 10px;text-align:right;font-weight:700">${fmtH(val(bu, 'all'))}</td></tr>`).join('');
    h += '<tr style="border-top:2px solid var(--line);background:var(--paper)"><td style="padding:8px 10px;font-weight:700">合計</td>' +
      st.ws.map(w => `<td style="padding:8px 6px;text-align:right;font-weight:700">${fmtH(colTot(w))}</td>`).join('') +
      `<td style="padding:8px 10px;text-align:right;font-weight:700;color:var(--brand)">${fmtH(colTot('all'))}</td></tr></table></div>`;
  }
  if (dirtyCount()) h += '<div class="hint">（含尚未儲存的修改）</div>';
  v.innerHTML = h;
}

async function loadBP() {

function renderBPList(v) {
  if (!S.bp) { v.innerHTML = '<div class="empty">讀取中…</div>'; loadBP(); return; }

  }).join('') + '</div>' : '<div class="empty">沒有符合的專案</div>';
  h += `<div class="hint">修改會直接寫入雲端硬碟的「${esc(S.bp.title || 'BU Project')}」，所有人「新增專案」時會看到最新清單。已加入工時表的專案分頁名稱不會跟著改。</div>`;
  if (S.bp.url) h += `<a class="ghost" href="${esc(S.bp.url)}" target="_blank" rel="noopener" style="text-decoration:none">在 Google 試算表開啟 BU Project ↗</a>`;

  const s = $('#bpSearch');
  s.oninput = () => { S.bpQuery = s.value; const pos = s.selectionStart; renderBPList(v); const n = $('#bpSearch'); n.focus(); n.setSelectionRange(pos, pos); };

function bpEdit(idx) {
  const tm = S.bp.teams[S.bpTeam];
  const cur = idx >= 0 ? tm.rows[idx] : { name: '', bu: '' };
  const bus = new Set(); S.bp.teams.forEach(t => t.rows.forEach(r => r.bu && bus.add(r.bu)));
  for (let i = 1; i <= 15; i++) bus.add('BU' + i);
  const M = openModal(idx >= 0 ? '修改專案' : '新增專案 · ' + esc(tm.team), `
    <div class="card field">
      <label>專案名稱</label><input class="search" id="bpName" value="${esc(cur.name)}" autocomplete="off">
      <label>BU</label><input class="search" id="bpBu" list="buList" value="${esc(cur.bu)}" autocomplete="off" placeholder="例如 BU10">
      <datalist id="buList">${[...bus].sort(buSort).map(b => `<option value="${esc(b)}">`).join('')}</datalist>
      ${idx >= 0 ? '<div class="hint">改名不會更改已加入工時表的專案分頁名稱。</div>' : ''}
    </div>`,
    `<button class="primary" style="margin:0" id="bpOk">${idx >= 0 ? '儲存修改' : '新增'}</button>` +
    (idx >= 0 ? '<button class="ghost" style="margin:8px 0 0;color:var(--err)" id="bpDel">刪除這個專案</button>' : ''));
  setTimeout(() => M.q('#bpName').focus(), 50);
  const commit = async rows => {
    const teams = S.bp.teams.map((t, i) => ({ col: t.col, rows: i === S.bpTeam ? rows : t.rows }));
    M.close();
    S.bp = await busy('寫入 BU Project…', () => callA('api_buProjectsSave', teams, S.bp.ver));
    render(); toast('✔ 專案清單已更新');
  };
  M.q('#bpOk').onclick = () => {
    const name = M.q('#bpName').value.trim(), bu = M.q('#bpBu').value.trim().toUpperCase().replace(/^BU\s+/, 'BU');
    if (!name) return toast('請輸入專案名稱', true);
    if (tm.rows.some((r, i) => i !== idx && r.name.toLowerCase() === name.toLowerCase())) return toast('「' + name + '」已經在 ' + tm.team + ' 的清單裡', true);
    const rows = tm.rows.map(r => Object.assign({}, r));
    if (idx >= 0) rows[idx] = { name, bu }; else rows.push({ name, bu });
    commit(rows).catch(() => {});
  };
  if (idx >= 0) M.q('#bpDel').onclick = () => {
    if (!confirm('從 ' + tm.team + ' 的清單刪除「' + cur.name + '」？\n(已加入工時表的專案分頁不會被刪除)')) return;
    commit(tm.rows.filter((_, i) => i !== idx)).catch(() => {});
  };
}

// 每週備份卡片 (Admin 頁最上方)
function nextBackupText() {
  const n = new Date(); const d = new Date(n);
  d.setHours(17, 0, 0, 0);
  d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7));
  if (d <= n) d.setDate(d.getDate() + 7);
  return (d.getMonth() + 1) + '/' + d.getDate() + '（週三）17:00';
}
function backupCardHtml() {
  const b = S.backup;
  if (b === undefined) { setTimeout(loadBackup, 0); S.backup = null; }
  if (!b) return '<div class="card" style="margin-bottom:6px;background:var(--note1)"><b>每週備份</b><div class="hint">讀取備份狀態…</div></div>';
  return `<div class="card" style="margin-bottom:6px;background:var(--note1)">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="ic" style="width:48px;height:48px;border-radius:14px;border:1.5px solid var(--ink);display:grid;place-items:center;background:#fff;flex:none">
        <svg viewBox="0 0 24 24" style="width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h4l2 2h7A1.5 1.5 0 0 1 20 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" style="fill:var(--brand-l)"/><path d="M12 11v5m-2.3-2.3L12 16l2.3-2.3"/></svg></span>
      <div style="flex:1;min-width:0"><b>每週備份</b>
        <div style="font-size:12px">${b.last ? '上次：' + esc(b.last.when) + '・' + b.last.files + ' 個檔案' : '還沒有備份過'}</div>
        <div style="font-size:12px;color:${b.scheduled ? 'var(--ok)' : 'var(--err)'}">${b.scheduled ? '✔ 自動備份：下次 ' + nextBackupText() : '✖ 自動備份未啟用'}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="primary" data-act="backupnow" style="margin:0;flex:1;padding:10px">立即備份</button>
      <button class="ghost" data-act="${b.scheduled ? 'backupoff' : 'backupon'}" style="margin:0;flex:1;padding:10px">${b.scheduled ? '停用自動備份' : '啟用每週三 17:00'}</button>
    </div>
    <div class="hint">${esc(b.source)} → <a href="${esc(b.folderUrl)}" target="_blank" rel="noopener" style="color:var(--brand-d)">${esc(b.location)} ↗</a>，每次備份會覆蓋上一次（舊備份移到垃圾桶）。</div>
  </div>`;
}
async function loadBackup() {
  try { S.backup = await call('api_adminBackupStatus'); } catch (e) { S.backup = null; toast(e.message, true); return; }
  const c = $('#backupCard'); if (c && S.route === 'admin') c.innerHTML = backupCardHtml();
}

// ===== Admin：本期所有人的 BU 時數 (可依 Team 分開看) =====
async function openBuSum(folderId, refresh) {
  if (!S.folders) S.folders = await busy('讀取週次…', () => callA('api_listFolders'));
  const fid = folderId || (S.data && S.data.folderId) || (S.folders[0] && S.folders[0].id);
  if (!fid) return toast('找不到週次資料夾', true);
  if (S.route !== 'busum') S.bsFrom = S.route;
  const data = await busy(refresh ? '重新統計所有人的時數…（約 20~60 秒）' : '統計所有人的時數…（第一次約 20~60 秒）',
    () => call('api_adminBuSummary', fid, !!refresh)).catch(() => null);
  if (!data) return;
  if (!S.bs || S.bs.folderId !== data.folderId) { S.bsGroup = ''; S.bsWeek = 'all'; S.bsOpen = {}; }
  S.bs = data; S.route = 'busum'; render(); window.scrollTo(0, 0);
}
function bsAgg(group, week) {                // -> { bu: { total, people: { name: h } } }
  const d = S.bs, out = {};
  d.rows.forEach(([pi, bi, w, hrs]) => {
    const p = d.people[pi];
    if (group && p.team !== group) return;
    if (week !== 'all' && w !== week) return;
    const bu = d.bus[bi];
    const o = out[bu] = out[bu] || { total: 0, people: {} };
    o.total += hrs; o.people[p.name] = (o.people[p.name] || 0) + hrs;
  });
  return out;
}
function renderBuSum(v) {
  const d = S.bs;
  setBar('BU 時數 · 全部人', d.folderName, true, true);
  const groups = [''].concat(d.teams);
  const cnt = g => d.people.filter(p => !g || p.team === g).length;
  const sel = S.bsWeek || 'all', grp = S.bsGroup || '';
  const agg = bsAgg(grp, sel);
  const rows = Object.keys(agg).sort(buSort).map(bu => ({ bu, h: agg[bu].total }));
  const tot = rows.reduce((s, r) => s + r.h, 0);
  const max = Math.max(1, ...rows.map(r => r.h));
  const dash = '<span style="color:#c4b9a3">-</span>';

  let h = `<select class="search" id="bsFolder">${S.folders.map(f => `<option value="${esc(f.id)}" ${f.id === d.folderId ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`;
  h += '<div class="chips">' + groups.map(g => `<button class="chip ${g === grp ? 'on' : ''}" data-bsgroup="${esc(g)}">${esc(g || '全部人')} (${cnt(g)})</button>`).join('') + '</div>';
  h += '<div class="chips">' + [['all', '全部期間']].concat(d.weeks.map(w => [w, 'Week ' + w]))
    .map(([w, t]) => `<button class="chip ${w === sel ? 'on' : ''}" data-bsweek="${esc(w)}">${esc(t)}</button>`).join('') + '</div>';
  h += `<div class="summary"><div><b>${fmtH(tot)}</b><small>${sel === 'all' ? '本期' : 'Week ' + esc(sel)} 總時數</small></div>
    <div><b>${cnt(grp)}</b><small>${esc(grp || '全部')} 人數</small></div><div><b>${rows.length}</b><small>BU 數</small></div></div>`;

  // 依 Team 分開 (選「全部人」時)
  if (!grp && d.teams.length && rows.length) {
    const byTeam = d.teams.map(t => bsAgg(t, sel));
    h += '<div class="section-title">各 Team 的 BU 時數' + (sel === 'all' ? '' : '（Week ' + esc(sel) + '）') + '</div>';
    h += '<div class="card" style="padding:0;overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">';
    h += '<tr style="background:var(--brand-l)"><th style="text-align:left;padding:8px 10px">BU</th>' + d.teams.map(t => `<th style="padding:8px 8px;text-align:right">${esc(t)}</th>`).join('') + '<th style="padding:8px 10px;text-align:right">合計</th></tr>';
    h += rows.map(r => `<tr style="border-top:1px dashed var(--line)"><td style="padding:7px 10px;font-weight:600">${esc(r.bu)}</td>` +
      byTeam.map(a => `<td style="padding:7px 8px;text-align:right">${a[r.bu] ? fmtH(a[r.bu].total) : dash}</td>`).join('') +
      `<td style="padding:7px 10px;text-align:right;font-weight:700">${fmtH(r.h)}</td></tr>`).join('');
    h += '<tr style="border-top:2px solid var(--ink);background:var(--paper)"><td style="padding:8px 10px;font-weight:700">合計</td>' +
      byTeam.map(a => `<td style="padding:8px 8px;text-align:right;font-weight:700">${fmtH(Object.values(a).reduce((s, x) => s + x.total, 0))}</td>`).join('') +
      `<td style="padding:8px 10px;text-align:right;font-weight:700;color:var(--brand-d)">${fmtH(tot)}</td></tr></table></div>`;
  }

  // BU 長條 (點開看每個人)
  h += '<div class="section-title">' + esc(grp || '全部人') + ' · 各 BU（點開看每個人）</div>';
  if (!rows.length) h += '<div class="empty">這段期間沒有時數</div>';
  else h += '<div class="list">' + rows.map(r => {
    let x = `<button class="item" data-bsopen="${esc(r.bu)}" style="display:block">
      <div style="display:flex;align-items:center;gap:10px"><b style="flex:1">${esc(r.bu)}</b>
        <span style="color:var(--muted);font-size:12px">${Math.round(r.h / tot * 100)}%</span>
        <b class="hand" style="color:var(--brand-d);font-size:20px;font-weight:400;min-width:54px;text-align:right">${fmtH(r.h)}h</b></div>
      <div class="pbar" style="margin-top:6px"><span style="width:${(r.h / max * 100).toFixed(1)}%;background:var(--brand)"></span></div></button>`;
    if (S.bsOpen[r.bu]) x += '<div style="background:var(--paper);padding:4px 14px 10px">' + Object.entries(agg[r.bu].people).sort((a, b) => b[1] - a[1])
      .map(([n, hh]) => `<div style="display:flex;padding:5px 0;font-size:14px"><span style="flex:1">${esc(n)} <small style="color:var(--muted)">${esc((d.people.find(p => p.name === n) || {}).team || '')}</small></span><b>${fmtH(hh)}h</b></div>`).join('') + '</div>';
    return x;
  }).join('') + '</div>';

  // 各週 × BU
  if (rows.length) {
    const allAgg = bsAgg(grp, 'all');
    const perWeek = {}; d.weeks.forEach(w => { perWeek[w] = bsAgg(grp, w); });
    h += '<div class="section-title">' + esc(grp || '全部人') + ' · 各週 BU 時數</div><div class="card" style="padding:0;overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap">';
    h += '<tr style="background:var(--brand-l)"><th style="text-align:left;padding:8px 10px">BU</th>' + d.weeks.map(w => `<th style="padding:8px 6px;text-align:right">W${esc(w)}</th>`).join('') + '<th style="padding:8px 10px;text-align:right">合計</th></tr>';
    h += Object.keys(allAgg).sort(buSort).map(bu => `<tr style="border-top:1px dashed var(--line)"><td style="padding:7px 10px;font-weight:600">${esc(bu)}</td>` +
      d.weeks.map(w => { const a = perWeek[w][bu]; return `<td style="padding:7px 6px;text-align:right">${a ? fmtH(a.total) : dash}</td>`; }).join('') +
      `<td style="padding:7px 10px;text-align:right;font-weight:700">${fmtH(allAgg[bu].total)}</td></tr>`).join('');
    h += '</table></div>';
  }
  h += `<div class="hint">統計時間 ${esc(d.at)}（10 分鐘內重開會用同一份結果，按右上角 ↻ 重新統計）${d.failed.length ? '<br>⚠ 無法讀取：' + esc(d.failed.join('、')) : ''}</div>`;
  v.innerHTML = h;
}

// 週次欄位
function weekFields(d) {
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><label>起始年</label><input class="search" id="wSy" inputmode="numeric" value="${d.sy}"></div>
    <div><label>起始週</label><input class="search" id="wSw" inputmode="numeric" value="${d.sw}"></div>
    <div><label>截止年</label><input class="search" id="wEy" inputmode="numeric" value="${d.ey}"></div>
    <div><label>截止週</label><input class="search" id="wEw" inputmode="numeric" value="${d.ew}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;margin:4px 0 0"><input type="checkbox" id="wOver" style="width:18px;height:18px"> 覆蓋已存在的檔案</label>`;
}
const weekVals = M => ['#wSy', '#wSw', '#wEy', '#wEw'].map(s => Number(M.q(s).value));
async function adminDefaults() {
  if (!S.adminDef) S.adminDef = await busy('讀取中…', () => call('api_adminDefaults'));
  return S.adminDef;
}
async function openNewWeek() {
  const d = await adminDefaults();
  const M = openModal('產生新週次工時表', `<div class="card field">${weekFields(d)}<div id="wOut" class="hint"></div></div>`,
    '<button class="ghost" style="margin:0 0 8px" id="wPrev">預覽</button><button class="primary" style="margin:0" id="wGo">產生</button>');
  M.q('#wPrev').onclick = async () => {
    const r = await busy('預覽中…', () => call('api_adminPreviewWeek', ...weekVals(M))).catch(() => null);
    if (r) M.q('#wOut').innerHTML = `資料夾：<b>${esc(r.folderName)}</b>${r.exists ? '（已存在）' : '（新建）'}<br>成員 ${r.members.length} 人：${esc(r.members.join('、'))}<br>檔名範例：${esc(r.sampleFile)}`;
  };
  M.q('#wGo').onclick = async () => {
    const w = weekVals(M);
    if (!confirm('產生 Week ' + w[1] + ' ~ ' + w[3] + ' 的工時表？\n每個成員都會產生一個檔案，約需 1~5 分鐘。')) return;
    const r = await busy('產生中… (約 1~5 分鐘，請勿關閉 App)', () => call('api_adminGenerateWeek', ...w, M.q('#wOver').checked)).catch(() => null);
    if (!r) return;
    M.q('#wOut').innerHTML = `✔ 完成：<b>${esc(r.folderName)}</b><br>已產生 ${r.created.length} 個檔案` +
      (r.skipped.length ? `，略過已存在 ${r.skipped.length} 個` : '') + `<br><a href="${esc(r.folderUrl)}" target="_blank" rel="noopener">開啟資料夾 ↗</a>`;
    S.folders = null; toast('✔ 新週次已產生');
  };
}
async function openNewPerson() {
  const d = await adminDefaults();
  const M = openModal('單獨新增某人檔案', `<div class="card field">
      <label>成員</label><select class="search" id="pName">${d.members.map(m => `<option value="${esc(m.name)}">${esc(m.name)}${m.team ? '｜' + esc(m.team) : ''}</option>`).join('')}</select>
      ${weekFields(d)}<div id="wOut" class="hint"></div></div>`,
    '<button class="ghost" style="margin:0 0 8px" id="wPrev">預覽</button><button class="primary" style="margin:0" id="wGo">產生</button>');
  M.q('#wPrev').onclick = async () => {
    const r = await busy('預覽中…', () => call('api_adminPreviewPerson', ...weekVals(M), M.q('#pName').value)).catch(() => null);
    if (r) M.q('#wOut').innerHTML = `資料夾：<b>${esc(r.folderName)}</b>${r.folderExists ? '' : '（會新建）'}<br>檔名：${esc(r.fileName)}${r.fileExists ? '（<b style="color:var(--err)">已存在</b>，要勾選覆蓋才會重新產生）' : ''}`;
  };

async function exportXlsx() {
  const f = await pickFolder('匯出哪個週次？');
  const r = await busy('匯出中… (檔案多時約 1~3 分鐘)', () => call('api_adminExport', f.id)).catch(() => null);
  if (!r) return;
  const bin = atob(r.b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([arr], { type: 'application/zip' }));
  a.download = r.zipName; document.body.appendChild(a); a.click(); a.remove();
  toast('✔ 已匯出 ' + r.names.length + ' 個檔案' + (r.failed.length ? '，失敗 ' + r.failed.length + ' 個' : ''));

async function openPins() {
  let ps = await busy('讀取中…', () => call('api_adminPins'));
  const shown = {};                                   // 已檢視的密碼 (只留在這個畫面)
  const status = p => {

    if (p.name in shown) return shown[p.name]
      ? `密碼：<b class="hand" style="font-size:20px;letter-spacing:2px;color:var(--brand-d)">${esc(shown[p.name])}</b>`
      : '舊版密碼無法顯示，對方下次登入後就看得到（或直接重設）';
    return '已設定密碼';
  };
  const body = () => '<div class="list">' + ps.map(p => `<div class="item"><div class="t"><b>${esc(p.name)}</b><small>${status(p)}</small></div>
      ${p.has ? `<button class="chip" data-vp="${esc(p.name)}">${p.name in shown ? '隱藏' : '檢視'}</button>
      <button class="chip" data-rp="${esc(p.name)}" style="color:var(--err)">重設</button>` : ''}</div>`).join('') + '</div>' +
    '<div class="hint">重設後，該成員下次開 App 時可以重新設定密碼；他其他手機上的登入會失效。</div>';
  const M = openModal('App 密碼管理', body());
  M.el.addEventListener('click', async e => {
    const v = e.target.closest('[data-vp]');
    if (v) {
      const n = v.dataset.vp;
      if (n in shown) delete shown[n];
      else shown[n] = await busy('讀取中…', () => call('api_adminViewPin', n)).catch(() => null);
      if (shown[n] === null) delete shown[n];
      M.q('.sheet-b').innerHTML = body();
      return;
    }
    const b = e.target.closest('[data-rp]'); if (!b) return;
    if (!confirm('重設「' + b.dataset.rp + '」的 App 密碼？')) return;
    ps = await busy('重設中…', () => call('api_adminResetPin', b.dataset.rp)).catch(() => ps);
    delete shown[b.dataset.rp];
    M.q('.sheet-b').innerHTML = body(); toast('✔ 已重設');
  });
}

async function loadMembers() {

function renderMembers(v) {
  const t = S.tm;
  if (!t) { v.innerHTML = '<div class="empty">讀取中…</div>'; return; }
  setBar('Team Member', t.title, true, true);
  const groups = t.layout === 'single' ? [''] : t.teams.slice();
  t.members.forEach(m => { if (!groups.includes(m.team)) groups.push(m.team); });
  const opts = sel => groups.map(g => `<option value="${esc(g)}" ${g === sel ? 'selected' : ''}>${esc(g || '(未分組)')}</option>`).join('');
  let h = '';
  groups.forEach((g, gi) => {
    const ms = t.members.map((m, i) => Object.assign({ i }, m)).filter(m => m.team === g);
    h += `<div class="section-title">${esc(g || (t.layout === 'single' ? '成員' : '(未分組)'))} · ${ms.length} 人</div><div class="list">`;
    h += ms.map(m => `<div class="item" style="padding:10px 14px"><div class="t"><b>${esc(m.name)}</b></div>
      ${t.layout === 'single' ? '' : `<select data-tmteam="${m.i}" style="border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;max-width:130px">${opts(m.team)}</select>`}
      <button class="del" data-tmdel="${m.i}" aria-label="刪除">✕</button></div>`).join('');
    h += `<div class="item" style="padding:8px 10px"><input class="search" data-tmnew="${gi}" placeholder="新增成員名字" style="margin:0;flex:1"><button class="chip on" data-tmadd="${gi}">加入</button></div></div>`;
  });
  if (t.layout === 'cols') h += '<button class="ghost" data-act="tmteam">＋ 新增 Team 欄</button>';
  h += `<button class="primary" data-act="tmsave" ${S.tmDirty ? '' : 'disabled'}>${S.tmDirty ? '儲存 Team Member' : '沒有修改'}</button>`;
  h += `<div class="hint">新增的成員要再用「單獨新增某人檔案」產生工時表；刪除成員不會刪除他已經產生的檔案。</div>
    <a class="ghost" href="${esc(t.url)}" target="_blank" rel="noopener" style="text-decoration:none">在 Google 試算表開啟 Team Member ↗</a>`;
  v.innerHTML = h;
  S.tmGroups = groups;
}

    const isF = !!d.disfolder;

      toast('已刪除「' + d.dname + '」'); S.folders = null;
      return loadDrive(S.drive.id);
    } catch (err) { return; }
  }
  if (d.dfolder) return loadDrive(d.dfolder);

    const inp = document.querySelector('[data-tmnew="' + d.tmadd + '"]');

    if (!name) return toast('請輸入名字', true);
    if (S.tm.members.some(m => m.name.toLowerCase() === name.toLowerCase())) return toast('「' + name + '」已經在名單裡', true);
    S.tm.members.push({ name, team: S.tmGroups[Number(d.tmadd)] }); S.tmDirty = true; return render();
  }

  try {
    if (act === 'admin') { S.route = 'admin'; render(); }

      if (!confirm('現在把 Working Hours 資料夾完整備份一次？\n會覆蓋上一次的備份，檔案多時約需 1~5 分鐘。')) return;

      render(); toast(act === 'backupon' ? '✔ 已啟用每週三 17:00 自動備份' : '已停用自動備份');
    }
    else if (act === 'bplist') {
      if (!S.data) return toast('請先開啟一份工時表', true);
      S.route = 'sheet'; S.tab = 'list'; render(); window.scrollTo(0, 0);
    }
    else if (act === 'butab') await openBuSum(null, false);
    else if (act === 'drive') await loadDrive('');
    else if (act === 'members') await loadMembers();
    else if (act === 'newweek') await openNewWeek();
    else if (act === 'newperson') await openNewPerson();
    else if (act === 'openany') await openAnyone();
    else if (act === 'export') await exportXlsx();
    else if (act === 'pins') await openPins();
    else if (act === 'tmteam') {
      const n = (prompt('新的 Team 名稱 (例如 ABC Team)') || '').trim();
      if (n && !S.tm.teams.includes(n)) { S.tm.teams.push(n); S.tmDirty = true; render(); }

      S.tmDirty = false; S.adminDef = null; render(); toast('✔ Team Member 已儲存');
    }
  } catch (err) { /* busy() 已顯示錯誤 */ }
});

    api_addProjects: (t, id, picks) => { auth(t); picks.forEach(pk => { const adc = file.projects.pop(); file.projects.push(mk(pk.name, pk.bu, false, null), adc); avail = avail.filter(a => a.name !== pk.name); }); return Object.assign(clone(file), { added: picks.map(p => p.name) }); },
    api_fixFromAll: (t, id, useProj) => { auth(t); const n = file.diffs.length; file.diffs.forEach(d => { const p = file.projects.find(x => x.sheet === d.sheet); if (!useProj) p.cells[d.k].h = d.all; }); file.diffs = []; return Object.assign(clone(file), { fixed: n }); },
    api_deleteProject: (t, id, n) => { auth(t); file.projects = file.projects.filter(p => p.sheet !== n); return clone(file); },
  };
})();
</script>
